<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>кроки, необхідні для використання Handlebars👇</h2>
    <ul>
      <li>Крок 1: Підключення бібліотеки Handlebars до вашого проєкту.</li>
      <li>Крок 2: Створення шаблону Handlebars.</li>
      <li>Крок 3: Створення даних для шаблону.</li>
      <li>Крок 4: Компіляція шаблону Handlebars</li>
      <li>Крок 5: Використання шаблону Handlebars.</li>
    </ul>
    <div class="gallery js-gallery"></div>
    <div class="userContainer"></div>

    <template class="countryTemplate">
        {{#each country}}
        <li class="gallery__item">
    <div class="gallery__thumb">
        <img src="{{flag}}" alt="flag" width="320">
    </div>
    <h2>{{name}}</h2>
    <p><b>Столиця: </b>{{capital}}</p>
    <p><b>Валюта:</b>{{currency}}</p>
    <p><b>Офiційна мова:</b>{{language}}</p>
    <p><b>Населення:</b>{{population}}</p>

    {{#if infected}}
    <p style="color: red;">Все пропало!!!!!!</p>
  {{/infected}}
      {{#if infected}}
    <p style="color: green;">Фух, все добре</p>
      {{/infected}}

</li>
        {{/each}}
      </ul>
    </template>
    <template id="userTemplete">
      <div>
        <h2>Name:{{name}}</h2>
        <p>surname:{{surname}}</p>
      </div>
    </template>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
